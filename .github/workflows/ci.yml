name: MoUI Studio CI

# MoUI Studio 独立子仓库的回归网，按 MoUI 母仓库 CI 的方式拆分为多个并行 job。
#
# 本仓库同时是 MoUI 母仓库（wzzc-dev/MoUI）的 git submodule，母仓库的
# `checks/profiles.json` 的 pr profile 已经登记了其中 7 个门禁。但那些门禁
# **只在母仓库的 CI 里跑**：单独 clone 本仓库、或在非 PR 分支上开发时，
# Studio 自己的回归完全没有自动覆盖。本工作流把那些门禁按本仓库的包路径
# （不带 `moui_studio/` 前缀）落地，并补上母仓库 pr profile 没有的两项
# （app 的 wasm-gc 测试、web 入口构建）与 moon check / moon fmt 卫生门。
#
# 有意不收的门禁（及原因）：
# - **i18n catalog 生成检查**：生成器是母仓库的 MoonBit 工具
#   `tools/moui/generate_i18n_catalogs`（约 1k 行）+ Node runner，
#   不属于本仓库；`app/i18n_catalog_generated.mbt` 已入库，漂移由母仓库
#   pr profile 的 "studio i18n catalogs" 步骤把关。
# - **真机 / 真 Skia 冒烟**：路径触发，不是每日门（见母仓库 smoke 目录）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 本仓库的测试/检查都不链接 Skia（入口包的 Skia 绑定只进最终可执行文件）。
# 依赖的 moui_skia prebuild 在 native 目标下默认会下载约 200MB 的 Skia
# release 并生成本仓库用不到的链接 flag，这里显式关掉，CI 提速且避免
# 下载抖动。wasm-gc 目标本来就会跳过该 prebuild。
env:
  MOUI_SKIA_DISABLE_PREBUILD_SKIA: "1"

jobs:
  workspace-baseline:
    name: Workspace baseline (check + fmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # moon check 只做类型检查，不触发依赖 prebuild，所以不需要系统包。
      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Install dependencies
        run: |
          moon version --all
          moon update

      # 卫生门：0 错误 0 警告（本仓库自有代码；母仓库其他成员的警告不会
      # 出现在这里，因为单独 checkout 本仓库时没有 moon.work 工作区）。
      - name: moon check (native)
        run: moon check --target native

      - name: moon fmt --check
        run: moon fmt --check

  domain-tests:
    name: Domain layer tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Linux native dependencies
        uses: ./.github/actions/setup-linux-native-deps

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Install dependencies
        run: moon update

      # 领域层：零 UI 依赖，五包一次跑完（moon test 接受多包路径并汇总）。
      - name: Domain tests
        run: |
          moon test domain/ir domain/studio_lang domain/codec domain/blocks \
            domain/proposals --target native

  kernel-plugin-tests:
    name: Kernel and plugin tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Linux native dependencies
        uses: ./.github/actions/setup-linux-native-deps

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Install dependencies
        run: moon update

      # 插件内核 + 已出壳插件。chrome / plugins/project / plugins/run 自身
      # 没有 *_test.mbt（它们由 app 的 wbtest 白盒覆盖），仍在命令里，
      # 包一多出编译错就会红。
      - name: Kernel, chrome and plugin tests
        run: |
          moon test kernel chrome plugins/ai plugins/markdown plugins/project \
            plugins/run plugins/terminal plugins/blocks --target native

  service-tests:
    name: Service layer tests
    # compile_native 的真工具链测试会构建导出 bundle 的 native GUI 入口，
    # 而导出的 GUI 组合根目前硬编码 macOS（moui/backend/macos +
    # platform=MacOS），Linux 上按设计编不过——与母仓库 pr profile 一样把
    # 服务层测试放在 macOS 上跑。
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Install dependencies
        run: moon update

      # 服务层：编译轨、差分门禁、导出。
      - name: Service tests
        run: |
          moon test services/compiled_runtime services/diff \
            services/compile_native services/export --target native

  app-tests:
    name: App tests (native + wasm-gc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Linux native dependencies
        uses: ./.github/actions/setup-linux-native-deps

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Install dependencies
        run: moon update

      # 应用层：解释轨 + 壳回归。native 与 wasm-gc 各跑一遍
      # （wasm-gc 那一项母仓库 pr profile 没有，这里补上）。
      - name: App tests (native)
        run: moon test app --target native

      - name: App tests (wasm-gc)
        run: moon test app --target wasm-gc

  export-kernel-sync:
    name: Export kernel sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Linux native dependencies
        uses: ./.github/actions/setup-linux-native-deps

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Install dependencies
        run: moon update

      # 导出内核漂移门：domain 源码改了忘同步 → 红。
      - name: Export kernel sync
        run: moon run tools/sync_kernel --target native -- --check

  web-entry-build:
    name: Web entry build (wasm-gc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Install dependencies
        run: moon update

      # Web 入口可构建（母仓库 pr profile 没有这一项）。
      - name: Web entry build (wasm-gc)
        run: moon build web_wasm --target wasm-gc
