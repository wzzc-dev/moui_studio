name: MoUI Studio Release

# 构建各平台产物并附加到 GitHub Release。
#
# 触发：
# - 推送 tag（`v*` 或 `*.*.*`，如 `v0.1.1` / `0.1.1`）→ 构建并发布该 tag；
# - workflow_dispatch 填 `tag` → 构建并发布（tag 不存在时以当前 SHA 创建）；
# - workflow_dispatch 留空 → 仅构建，产物挂在 workflow artifacts 上（试跑用）。
#
# 桌面产物走 release profile（真 Skia 静态链接，prebuild 自动下载 pinned
# release），Web 产物是可直接静态托管的 zip。发布 job 汇总四端产物并生成
# sha256sums.txt。

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.1). Empty = build only, no release.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve tag and version
        id: resolve
        run: |
          set -euo pipefail
          tag=""
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="${{ github.event.inputs.tag }}"
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then
            echo "Release tag: $tag (version $version)"
          else
            echo "Build-only run (no tag input)"
          fi

  build-macos:
    name: macOS app (arm64)
    runs-on: macos-14
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Install dependencies
        run: moon update

      # Native build links the pinned static Skia release; the prebuild
      # downloads it into .skia-cache on first use.
      - name: Package macOS app
        run: |
          sh scripts/package-macos-app.sh \
            --name "MoUI Studio" \
            --bundle-id dev.wzzc.moui.studio \
            --version "${{ needs.prepare.outputs.version }}" \
            --build-version "$GITHUB_RUN_NUMBER" \
            --profile release \
            --output dist/macos

      - name: Zip app bundle
        run: |
          cd dist/macos
          zip -qry "MoUI-Studio-macos-arm64.zip" "MoUI Studio.app"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: studio-macos
          path: dist/macos/MoUI-Studio-macos-arm64.zip
          if-no-files-found: error

  build-windows:
    name: Windows portable (x64)
    runs-on: windows-2022
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up vcpkg zlib and WebView2 SDK
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\windows\setup_msvc_deps.ps1 -InstallZlib -InstallWebView2

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Install dependencies
        shell: bash
        run: |
          moon version --all
          moon update

      - name: Package Windows portable folder
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\windows\package_windows_app_msvc.ps1 `
            -Package windows_skia `
            -AppName MoUIStudio `
            -Version "${{ needs.prepare.outputs.version }}" `
            -BuildNumber $env:GITHUB_RUN_NUMBER `
            -BuildProfile release

      - name: Zip portable folder
        shell: pwsh
        run: |
          Compress-Archive -Path dist\windows-msvc\MoUIStudio `
            -DestinationPath dist\windows\MoUI-Studio-windows-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: studio-windows
          path: dist/windows/MoUI-Studio-windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Linux binary (x64)
    runs-on: ubuntu-24.04
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Linux native dependencies
        uses: ./.github/actions/setup-linux-native-deps

      - name: Install Skia link dependencies
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            libfreetype-dev \
            libharfbuzz-dev \
            libvulkan-dev

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Install dependencies
        run: moon update

      - name: Package Linux binary
        run: |
          sh scripts/package-linux.sh \
            --version "${{ needs.prepare.outputs.version }}" \
            --profile release \
            --output dist/linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: studio-linux
          path: dist/linux/*.tar.gz
          if-no-files-found: error

  build-web:
    name: Web bundle (wasm-gc)
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Install dependencies
        run: moon update

      - name: Package Web bundle
        run: |
          sh scripts/package-web-bundle.sh \
            --version "${{ needs.prepare.outputs.version }}" \
            --profile release \
            --output dist/web

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: studio-web
          path: dist/web/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [prepare, build-macos, build-windows, build-linux, build-web]
    if: ${{ needs.prepare.outputs.tag != '' }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts and generate checksums
        run: |
          set -euo pipefail
          mkdir -p release
          find dist -type f \( -name '*.zip' -o -name '*.tar.gz' \) \
            -exec cp {} release/ \;
          ls -la release/
          cd release
          sha256sum ./*.zip ./*.tar.gz > sha256sums.txt

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets with clobber"
            gh release upload "$TAG" release/* --clobber \
              -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release/* \
              --target "$GITHUB_SHA" \
              --title "MoUI Studio $TAG" \
              --generate-notes \
              -R "$GITHUB_REPOSITORY"
          fi
