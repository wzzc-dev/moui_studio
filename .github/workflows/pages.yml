name: Deploy Studio Web

# 把 MoUI Studio 的 Web 版（wasm-gc）部署到 GitHub Pages 项目站点。
#
# 产物是 scripts/package-web-bundle.sh 组装的 checkout-root 镜像布局
# （web_wasm/ + .mooncakes/ + _build/）：入口页用仓库根相对路径加载
# ES-module 运行时和 wasm 模块，镜像布局让它在本站子路径
# (https://wzzc-dev.github.io/moui_studio/web_wasm/) 下也能正确解析。
# Actions 式 Pages 部署不做 Jekyll 处理，点开头的 .mooncakes/ 目录照常可服务。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build studio web bundle
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Install dependencies
        run: |
          moon version --all
          moon update

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build web bundle
        run: |
          sh scripts/package-web-bundle.sh \
            --version "dev" \
            --profile release \
            --output dist/pages

      - name: Verify bundle layout
        run: |
          test -f dist/pages/moui-studio-web/web_wasm/index.html
          test -f dist/pages/moui-studio-web/.mooncakes/wzzc-dev/moui_web_renderer/runtime.js
          test -f dist/pages/moui-studio-web/.mooncakes/wzzc-dev/moui_web_renderer/canvas2d_runtime.js
          test -f dist/pages/moui-studio-web/.mooncakes/wzzc-dev/moui_web_renderer/canvas2d/canvas2d_runtime.js
          test -f dist/pages/moui-studio-web/.mooncakes/wzzc-dev/moui/backend/web/browser_runtime.js
          test -f dist/pages/moui-studio-web/_build/wasm-gc/release/build/web_wasm/web_wasm.wasm

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages/moui-studio-web

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
